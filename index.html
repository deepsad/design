<style>
:root{color-scheme:dark;--bg:oklch(.19 .006 200);--pane:oklch(.23 .006 200);--raised:oklch(.27 .006 200);--line:oklch(.34 .007 200);--ink:oklch(.96 .004 200);--mut:oklch(.76 .009 200);--mint:oklch(.87 .106 190);font:15px Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:var(--bg)}
*{box-sizing:border-box}body{margin:0}button,select,input{font:inherit}button,select{cursor:pointer}button{color:inherit;background:transparent;border:0}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--mint);outline-offset:3px}button:active{transform:translateY(1px)}.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}.defs{position:absolute;width:0;height:0;overflow:hidden}header{height:66px;padding:0 3.5%;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.brand,.headernote,.actions,.titlebar,.bar,.tool,.section-title,.row,.option,.foot,.swatches{display:flex;align-items:center}.brand{gap:12px;font-size:25px;font-weight:730;letter-spacing:-.04em}.brandmark{width:32px;height:32px;color:var(--mint)}.headernote{gap:9px;font-size:12px;color:var(--mut)}.dot{width:7px;height:7px;border-radius:50%;background:var(--mint)}main{max-width:1680px;margin:auto;padding:30px 3.5% 25px}.titlebar{justify-content:space-between;gap:18px;margin-bottom:23px}h1{font-size:32px;letter-spacing:-.035em;margin:0;font-weight:620;line-height:1.2}.actions{gap:9px}.format,select{border:1px solid var(--line);background:var(--pane);color:var(--ink);border-radius:5px;padding:9px}.primary{background:var(--mint);color:oklch(.19 .04 191);font-weight:650;padding:10px 17px;border-radius:5px;display:flex;align-items:center;gap:9px}.primary:hover{filter:brightness(1.08)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 316px;gap:18px;align-items:start}.panel{border:1px solid var(--line);border-radius:8px;background:var(--pane);overflow:hidden}.bar{height:49px;justify-content:space-between;padding:0 17px;border-bottom:1px solid var(--line);gap:10px}.bar h2,.section-title{display:flex;align-items:center;gap:9px;font-size:14px;letter-spacing:-.015em;font-weight:600;margin:0}.bar h2 .ico{color:var(--mut)}.tool{gap:2px}.tool button,.reset{padding:5px 7px;border-radius:4px}.tool button:hover,.reset:hover{background:var(--line)}.tool output,.mono,.foot,.value{font-family:"IBM Plex Mono",Consolas,monospace;font-variant-numeric:tabular-nums}.tool output{font-size:12px;color:var(--mut);min-width:46px;text-align:center}.stage{height:clamp(420px,calc(100svh - 242px),800px);position:relative;overflow:hidden;display:grid;place-items:center;isolation:isolate;background-color:oklch(.207 .006 200);background-image:radial-gradient(oklch(.37 .009 200) .75px,transparent .85px);background-size:12px 12px}.paper{position:relative;flex:none;transform:scale(var(--zoom,1));box-shadow:0 6px 22px #0004;background:white}.paper>svg{width:100%;height:100%;display:block}.paper.clear{background:repeating-conic-gradient(#e1e5e4 0 25%,white 0 50%) center/14px 14px}.ruler{position:absolute;color:var(--mut);font:10px Consolas,monospace;display:flex;align-items:center;justify-content:center;gap:7px;pointer-events:none}.ruler:before,.ruler:after{content:"";background:var(--line);height:1px;flex:1}.ruler{left:0;right:0;top:-24px}.corner{position:absolute;width:11px;height:11px;border-color:var(--mut);border-style:solid;pointer-events:none}.tl{top:-5px;left:-5px;border-width:1px 0 0 1px}.tr{top:-5px;right:-5px;border-width:1px 1px 0 0}.bl{bottom:-5px;left:-5px;border-width:0 0 1px 1px}.br{bottom:-5px;right:-5px;border-width:0 1px 1px 0}.foot{border-top:1px solid var(--line);padding:12px 17px;justify-content:space-between;gap:8px;font-size:11px;color:var(--mut)}.foot>span:first-child{display:flex;align-items:center;gap:8px}.foot .dot{width:5px;height:5px}.side{padding:17px}.section-title{margin:0 0 14px}.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.type{min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:5px;display:grid;place-items:center;gap:5px;padding:8px 0 7px;font-size:11px;color:var(--mut)}.type svg{height:27px;width:32px;overflow:hidden}.type:hover{border-color:var(--mut)}.type[aria-pressed=true]{color:var(--mint);border-color:var(--mint);background:oklch(.29 .027 192)}.group+.group{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.row,.option{justify-content:space-between;gap:8px;font-size:13px}.row select{padding:5px 6px;font-size:12px}.slider{margin:12px 0 0}.value{font-size:11px;color:var(--mut);background:var(--raised);border:1px solid var(--line);border-radius:3px;padding:2px 6px}.range{appearance:none;width:100%;display:block;height:17px;margin:5px 0 0;cursor:pointer;background:transparent}.range::-webkit-slider-runnable-track{height:3px;border-radius:3px;background:linear-gradient(to right,var(--mint) var(--fill),var(--line) var(--fill))}.range::-webkit-slider-thumb{appearance:none;width:11px;height:11px;border-radius:50%;background:var(--mint);margin-top:-4px}.range::-moz-range-track{height:3px;background:var(--line)}.range::-moz-range-progress{background:var(--mint)}.range::-moz-range-thumb{border:none;background:var(--mint);height:11px;width:11px}.swatches{gap:5px}.swatch,.custom{width:22px;height:22px;border:2px solid var(--pane);border-radius:50%;padding:0}.swatch{background:var(--color)}.swatch[aria-pressed=true],.custom.active{outline:1px solid var(--ink)}.custom{position:relative;background:conic-gradient(#f29288,#e8cd78,#7dbcca,#ad9bd6,#f29288);overflow:hidden;cursor:pointer}.custom input{cursor:pointer;position:absolute;inset:0;width:100%;height:100%;opacity:0}.custom:focus-within{outline:2px solid var(--mint)}.option{min-height:29px;cursor:pointer}.option:first-of-type{margin-top:9px}.switch{appearance:none;position:relative;width:29px;height:16px;background:var(--line);border-radius:10px;cursor:pointer;margin:0}.switch:before{content:"";position:absolute;left:3px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--mut)}.switch:checked{background:var(--mint)}.switch:checked:before{background:var(--bg);left:16px}.reset{color:var(--mut);display:flex;align-items:center;gap:7px;font-size:12px}.reset .ico{width:14px}.notice{font-size:13px;color:var(--mint);min-height:1em;margin:8px 0 0;text-align:right}
@media(max-width:910px){.layout{grid-template-columns:minmax(0,1fr) 283px;gap:12px}main{padding:22px 18px}.side{padding:14px}.type{font-size:10px}}
@media(max-width:700px){header{height:50px;padding:0 15px}.brand{font-size:21px}.brandmark{width:25px}main{padding:17px 12px}.titlebar{flex-wrap:wrap;margin-bottom:14px;gap:12px}h1{font-size:25px}.layout{grid-template-columns:1fr}.stage{height:clamp(260px,50svh,450px)}.side{padding:17px}.type{font-size:12px}.headernote{font-size:11px}.primary,.format{font-size:13px;padding:8px}.bar{height:42px}.foot{padding:9px 12px}}
.drawbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
.tools,.pen-style,.history{display:flex;align-items:center;gap:3px}.drawbar button{border-radius:4px;padding:6px 8px;min-height:32px}.drawbar button:hover{background:var(--raised)}.drawbar button[aria-pressed=true]{background:oklch(.31 .035 192);color:var(--mint)}.drawbar button:disabled,.tool button:disabled{opacity:.35;cursor:default}.drawbar button:disabled:hover{background:transparent}.drawbar svg{width:16px;height:16px}.tools button{display:flex;align-items:center;gap:6px;font-size:12px}.pen-style{gap:6px;border-left:1px solid var(--line);padding-left:10px}.pen-style select{padding:5px;font-size:12px}.pen-style input{width:30px;height:28px;border:1px solid var(--line);border-radius:4px;padding:2px;background:var(--raised);cursor:pointer}.history{margin-left:auto}.paper>#ink{position:absolute;inset:0;touch-action:none;user-select:none;cursor:crosshair}.export-grid{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mut);cursor:pointer}.export-grid input{accent-color:var(--mint)}[hidden]{display:none!important}
@media(max-width:910px){.drawbar{gap:5px;padding:6px}.tools button{padding:5px 6px}.pen-style{padding-left:5px}}
@media(max-width:700px){.drawbar button{min-height:36px}.actions{flex-wrap:wrap}.drawbar{row-gap:4px}.history{margin-left:0}.drawbar .ico{width:15px}.stage{height:clamp(260px,45svh,450px)}}
</style>
<svg class="defs" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 16v4h16v-4"/></symbol>
<symbol id="frame" viewBox="0 0 24 24"><path d="M3 6h18M3 18h18M6 3v18M18 3v18"/></symbol>
<symbol id="minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
<symbol id="plus" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></symbol>
<symbol id="fit" viewBox="0 0 24 24"><path d="M3 9V4h5m8 0h5v5m0 6v5h-5m-8 0H3v-5"/></symbol>
<symbol id="resetIcon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 1 1 1 7M4 4v6h6"/></symbol>
<symbol id="pencilIcon" viewBox="0 0 24 24"><path d="m3 21 5-1 13-13-4-4L4 16zm11-15 4 4"/></symbol>
<symbol id="lineIcon" viewBox="0 0 24 24"><path d="m3 21 18-18"/></symbol>
<symbol id="ovalIcon" viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></symbol>
<symbol id="undoIcon" viewBox="0 0 24 24"><path d="m8 4-5 5 5 5M4 9h10a6 6 0 0 1 0 12"/></symbol>
<symbol id="redoIcon" viewBox="0 0 24 24"><path d="m16 4 5 5-5 5m4-5H10a6 6 0 0 0 0 12"/></symbol>
</defs></svg>
<header><div class="brand"><svg class="brandmark" viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M3 3h34v34H3z" stroke="currentColor"/><path d="M3 37A34 34 0 0 1 37 3v9a25 25 0 0 0-25 25zm16 0a18 18 0 0 1 18-18v8a10 10 0 0 0-10 10z" fill="currentColor"/></svg>Лекало</div><div class="headernote"><i class="dot"></i>Локальная студия</div></header>
<main><div class="titlebar"><h1>Генератор сеток</h1><div class="actions"><label class="export-grid" id="exportOptions" hidden><input type="checkbox" id="withGrid" checked>Включить сетку</label><select class="format" id="format" aria-label="Формат экспорта"><option>SVG</option><option>PNG</option></select><button class="primary" id="save"><svg class="ico"><use href="#download"/></svg><span id="saveLabel">Скачать сетку</span></button></div></div>
<div class="layout"><section class="panel"><div class="bar"><h2><svg class="ico"><use href="#frame"/></svg>Рабочий лист</h2><div class="tool"><button id="out" aria-label="Уменьшить" title="Уменьшить"><svg class="ico"><use href="#minus"/></svg></button><output id="scale">100%</output><button id="into" aria-label="Увеличить" title="Увеличить"><svg class="ico"><use href="#plus"/></svg></button><button id="fitView" aria-label="Вписать лист" title="Вписать лист"><svg class="ico"><use href="#fit"/></svg></button></div></div>
<div class="drawbar" aria-label="Рисование"><div class="tools" role="group" aria-label="Инструмент">
<button data-tool="pen" aria-pressed="true"><svg class="ico"><use href="#pencilIcon"/></svg>Перо</button>
<button data-tool="line" aria-pressed="false" title="Shift — шаг угла 45°"><svg class="ico"><use href="#lineIcon"/></svg>Линия</button>
<button data-tool="oval" aria-pressed="false" title="Shift — круг"><svg class="ico"><use href="#ovalIcon"/></svg>Овал</button></div>
<div class="pen-style"><input type="color" value="#23272a" id="inkColor" aria-label="Цвет штриха" title="Цвет штриха"><select id="inkWidth" aria-label="Толщина штриха" title="Толщина штриха"><option value="2">2 px</option><option value="4">4 px</option><option value="8" selected>8 px</option><option value="16">16 px</option><option value="32">32 px</option></select></div>
<div class="history"><button id="undo" disabled title="Отменить (Ctrl+Z)" aria-label="Отменить штрих"><svg class="ico"><use href="#undoIcon"/></svg></button><button id="redo" disabled title="Повторить (Ctrl+Shift+Z)" aria-label="Вернуть штрих"><svg class="ico"><use href="#redoIcon"/></svg></button></div></div>
<div class="stage" id="stage"><div class="paper" id="paper"><span class="ruler" id="dimension"></span><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><svg id="drawing" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Предпросмотр сетки"></svg><svg id="ink" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" aria-label="Лист для рисования"><g id="strokes" fill="none" stroke-linecap="round" stroke-linejoin="round"></g></svg></div></div><div class="foot"><span><i class="dot"></i><span id="current"></span></span><span id="sizeInfo"></span></div></section>
<aside class="panel side"><section class="group"><h2 class="section-title">Тип сетки</h2><div id="types" class="types"></div></section>
<section class="group"><h2 class="section-title">Геометрия</h2><label class="row">Размер листа<select id="size"><option value="512">512 × 512</option><option value="1024" selected>1024 × 1024</option><option value="1200">1200 × 1200</option><option value="2048">2048 × 2048</option></select></label><div id="geometry"></div></section>
<section class="group"><h2 class="section-title">Оформление</h2><div class="row">Цвет сетки<div class="swatches" id="swatches"></div></div><div id="appearance"></div><label class="option">Центральные оси<input type="checkbox" class="switch" id="axes" checked></label><label class="option">Прозрачный фон<input type="checkbox" class="switch" id="clear"></label></section>
<section class="group"><button class="reset" id="reset"><svg class="ico"><use href="#resetIcon"/></svg>Сбросить настройки</button></section></aside></div><p class="notice" id="notice" role="status"></p></main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const grids = [
  ['module','Модульная'], ['square','Квадратная'], ['iso','Изометрия'],
  ['radial','Радиальная'], ['dots','Точечная'], ['hex','Шестиугольная']
];
const colors = [['#467887','Петроль'],['#4d5664','Графит'],['#7162ac','Фиолетовый'],['#b46448','Терракота']];
const defaults = {kind:'module',size:1024,step:128,width:2,opacity:78,color:colors[0][0],axes:true,clear:false,rays:12};
let state = {...defaults};
let zoom = 1;
function round(n) { return +n.toFixed(4); }
function line(x1,y1,x2,y2) { return '<path d="M'+round(x1)+' '+round(y1)+'L'+round(x2)+' '+round(y2)+'"/>'; }
function circle(x,y,r) { return '<circle cx="'+round(x)+'" cy="'+round(y)+'" r="'+round(r)+'"/>'; }
// All geometry is measured in output pixels around the centre of the sheet.
function geometry(kind, half, step, rays, thickness) {
  let base = '', detail = '';
  const span = half*2;
  const count = Math.ceil(half/step);
  if (kind==='square' || kind==='module') {
    for(let i=-count;i<=count;i++){
      const p=i*step;
      if(Math.abs(p)<=half+.0001) base+=line(p,-half,p,half)+line(-half,p,half,p);
    }
    if(kind==='module'){
      base+=line(-half,-half,half,half)+line(-half,half,half,-half);
      for(let i=1;i<=count;i++) if(i*step<=half+.0001) detail+=circle(0,0,i*step);
      const radius=half/2;
      for(const [x,y] of [[0,-radius],[radius,0],[0,radius],[-radius,0]]) detail+=circle(x,y,radius);
      base='<g opacity=".42">'+base+'</g>';
    }
  } else if(kind==='radial'){
    const extent=half*Math.SQRT2;
    for(let r=step;r<=extent;r+=step) detail+=circle(0,0,r);
    for(let i=0;i<rays;i++){
      const a=i*2*Math.PI/rays;
      base+=line(0,0,extent*Math.cos(a),extent*Math.sin(a));
    }
  } else if(kind==='iso'){
    // Horizontal rows and two 60-degree families meet at the same vertices.
    for(let i=-count*2;i<=count*2;i++){
      const y=i*step*Math.sqrt(3)/2;
      if(Math.abs(y)<=half) base+=line(-half,y,half,y);
      const x=i*step;
      base+=line(x-half/Math.sqrt(3),-half,x+half/Math.sqrt(3),half);
      base+=line(x+half/Math.sqrt(3),-half,x-half/Math.sqrt(3),half);
    }
  } else if(kind==='dots'){
    // One tile keeps even dense dot grids small and editable.
    const r=Math.min(step*.22,thickness*1.7);
    detail='<defs><pattern id="dotTile" x="'+(-step/2)+'" y="'+(-step/2)+'" width="'+step+'" height="'+step+'" patternUnits="userSpaceOnUse"><circle cx="'+step/2+'" cy="'+step/2+'" r="'+r+'" stroke="none" fill="currentColor"/></pattern></defs><rect x="'+(-half)+'" y="'+(-half)+'" width="'+span+'" height="'+span+'" stroke="none" fill="url(#dotTile)"/>';
  } else if(kind==='hex'){
    const h=step*Math.sqrt(3)/2;
    const w=3*step;
    // Periodic paths share edges exactly once and meet across the tile boundary.
    const tile='M0 0H'+step+'L'+step*1.5+' '+h+'H'+step*2.5+'L'+w+' 0M0 '+(2*h)+'H'+step+'L'+step*1.5+' '+h+'M'+step*2.5+' '+h+'L'+w+' '+(2*h);
    detail='<defs><pattern id="hexTile" width="'+w+'" height="'+(2*h)+'" patternUnits="userSpaceOnUse"><path d="'+tile+'"/></pattern></defs><rect x="'+(-half)+'" y="'+(-half)+'" width="'+span+'" height="'+span+'" stroke="none" fill="url(#hexTile)"/>';
  }
  return base+detail;
}
function content(s){
  const n=s.size, mid=n/2, half=n*3/8;
  const axes=s.axes?'<g fill="none" stroke="'+s.color+'" stroke-width="'+s.width+'" stroke-dasharray="'+n/140+' '+n/180+'" opacity=".85">'+line(n/20,mid,n*.95,mid)+line(mid,n/20,mid,n*.95)+'</g>':'';
  return (s.clear?'':'<rect width="'+n+'" height="'+n+'" fill="#fff"/>')+
    '<g transform="translate('+mid+' '+mid+')"><defs><clipPath id="bounds"><rect x="'+(-half-s.width/2)+'" y="'+(-half-s.width/2)+'" width="'+(2*half+s.width)+'" height="'+(2*half+s.width)+'"/></clipPath></defs><g clip-path="url(#bounds)" fill="none" color="'+s.color+'" stroke="'+s.color+'" stroke-width="'+s.width+'" opacity="'+s.opacity/100+'">'+geometry(s.kind,half,s.step,s.rays,s.width)+'</g></g>'+axes;
}
// Thumbnails are independent of the export SVG's paint server IDs.
function thumbnail(kind){
  const id='mini'+kind;
  const geom=geometry(kind,12,kind==='hex'?4:kind==='dots'?4:6,12,1).replaceAll('dotTile',id+'d').replaceAll('hexTile',id+'h');
  return '<svg viewBox="-14 -14 28 28" aria-hidden="true"><defs><clipPath id="'+id+'"><rect x="-12" y="-12" width="24" height="24"/></clipPath></defs><g clip-path="url(#'+id+')" fill="none" stroke="currentColor" stroke-width=".95">'+geom+'</g></svg>';
}
for(const [kind,name] of grids){
  const b=document.createElement('button'); b.className='type'; b.dataset.kind=kind;
  b.innerHTML=thumbnail(kind)+'<span>'+name+'</span>'; b.onclick=()=>{state.kind=kind;render()}; $('types').append(b);
}
for(const [color,name] of colors){
  const b=document.createElement('button'); b.className='swatch'; b.dataset.color=color; b.style.setProperty('--color',color); b.title=name; b.setAttribute('aria-label',name);
  b.onclick=()=>{state.color=color;render()}; $('swatches').append(b);
}
$('swatches').insertAdjacentHTML('beforeend','<label class="custom" title="Выбрать свой цвет"><input type="color" id="customColor" aria-label="Свой цвет сетки"></label>');
$('customColor').oninput=e=>{state.color=e.target.value;render()};
const controls=[
  ['geometry','step','Шаг сетки',8,256,1,' px'],
  ['geometry','rays','Количество лучей',3,48,1,''],
  ['appearance','width','Толщина линий',.5,8,.5,' px'],
  ['appearance','opacity','Непрозрачность',5,100,1,'%']
];
for(const [parent,key,label,min,max,step] of controls){
  $(parent).insertAdjacentHTML('beforeend','<div class="slider" id="wrap-'+key+'"><label class="row" for="'+key+'">'+label+'<output class="value" for="'+key+'" id="val-'+key+'"></output></label><input class="range" type="range" id="'+key+'" min="'+min+'" max="'+max+'" step="'+step+'"></div>');
  $(key).oninput=e=>{state[key]=Number(e.target.value);render()};
}
for(const key of ['size','axes','clear']) $(key).onchange=e=>{state[key]=key==='size'?Number(e.target.value):e.target.checked;render()};
function layout(){
  const stage=$('stage');
  const side=Math.max(1,Math.min(stage.clientWidth-62,stage.clientHeight-80));
  $('paper').style.width=side+'px'; $('paper').style.height=side+'px'; $('paper').style.setProperty('--zoom',zoom);
  $('scale').textContent=Math.round(zoom*100)+'%';
  $('out').disabled=zoom<=.5; $('into').disabled=zoom>=2;
}
function render(){
  $('notice').textContent='';
  for(const b of $('types').children) b.setAttribute('aria-pressed',b.dataset.kind===state.kind);
  for(const b of document.querySelectorAll('.swatch')) b.setAttribute('aria-pressed',b.dataset.color===state.color);
  $('customColor').value=state.color;
  $('customColor').parentElement.classList.toggle('active',!colors.some(([color])=>color===state.color));
  $('size').value=state.size; $('axes').checked=state.axes; $('clear').checked=state.clear;
  for(const [,key,,min,max,,unit] of controls){
    $(key).value=state[key]; $('val-'+key).textContent=state[key].toLocaleString('ru')+unit;
    $(key).style.setProperty('--fill',((state[key]-min)/(max-min)*100)+'%');
  }
  $('wrap-rays').hidden=state.kind!=='radial';
  $('current').textContent=grids.find(([k])=>k===state.kind)[1]+' сетка';
  if(state.kind==='iso') $('current').textContent='Изометрическая сетка';
  $('dimension').textContent=state.size+' px'; $('sizeInfo').textContent=state.size+' × '+state.size+' px';
  $('paper').classList.toggle('clear',state.clear);
  $('drawing').setAttribute('viewBox','0 0 '+state.size+' '+state.size);
  $('drawing').innerHTML=content(state);
}
$('into').onclick=()=>{zoom=Math.min(2,zoom+.25);layout()};
$('out').onclick=()=>{zoom=Math.max(.5,zoom-.25);layout()};
$('fitView').onclick=()=>{zoom=1;layout()};
$('reset').onclick=()=>{state={...defaults};zoom=1;layout();render()};
const ink=$('ink'), strokes=$('strokes'), undone=[];
let tool='pen', gesture=null;
for(const button of document.querySelectorAll('[data-tool]')){
  button.onclick=()=>{
    tool=button.dataset.tool;
    for(const item of button.parentNode.children) item.setAttribute('aria-pressed',item===button);
  };
}
function updateDrawingActions(){
  const hasInk=strokes.childElementCount>0;
  $('undo').disabled=!hasInk;
  $('redo').disabled=undone.length===0;
  $('exportOptions').hidden=!hasInk;
  $('saveLabel').textContent=hasInk?'Скачать рисунок':'Скачать сетку';
}
$('undo').onclick=()=>{
  if(!gesture && strokes.lastElementChild) undone.push(strokes.removeChild(strokes.lastElementChild));
  updateDrawingActions();
};
$('redo').onclick=()=>{
  if(!gesture && undone.length) strokes.append(undone.pop());
  updateDrawingActions();
};
function localPoint(event){
  const point=ink.createSVGPoint();
  point.x=event.clientX; point.y=event.clientY;
  return point.matrixTransform(ink.getScreenCTM().inverse());
}
function extendStroke(event){
  const {node,start,mode}=gesture, point=localPoint(event);
  let dx=point.x-start.x, dy=point.y-start.y;
  if(mode==='pen'){
    const previous=node.points.getItem(node.points.numberOfItems-1);
    if(previous.x!==point.x || previous.y!==point.y) node.points.appendItem(point);
  }else if(mode==='line'){
    if(event.shiftKey){
      const length=Math.hypot(dx,dy);
      const angle=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4;
      dx=length*Math.cos(angle); dy=length*Math.sin(angle);
    }
    node.setAttribute('x2',start.x+dx); node.setAttribute('y2',start.y+dy);
  }else{
    if(event.shiftKey){
      const side=Math.max(Math.abs(dx),Math.abs(dy));
      dx=(Math.sign(dx)||1)*side; dy=(Math.sign(dy)||1)*side;
    }
    node.setAttribute('cx',start.x+dx/2); node.setAttribute('cy',start.y+dy/2);
    node.setAttribute('rx',Math.abs(dx)/2); node.setAttribute('ry',Math.abs(dy)/2);
  }
}
ink.onpointerdown=event=>{
  if(event.button!==0 || !event.isPrimary || gesture) return;
  event.preventDefault();
  const start=localPoint(event);
  const node=document.createElementNS(ink.namespaceURI,{pen:'polyline',line:'line',oval:'ellipse'}[tool]);
  node.setAttribute('stroke',$('inkColor').value);
  node.setAttribute('stroke-width',Number($('inkWidth').value)*1024/state.size);
  if(tool==='pen') node.setAttribute('points',start.x+','+start.y+' '+start.x+','+start.y);
  if(tool==='line'){node.setAttribute('x1',start.x);node.setAttribute('y1',start.y)}
  gesture={id:event.pointerId,node,start,mode:tool};
  strokes.append(node);extendStroke(event);ink.setPointerCapture(event.pointerId);
};
ink.onpointermove=event=>{
  if(!gesture || gesture.id!==event.pointerId) return;
  const samples=gesture.mode==='pen'?event.getCoalescedEvents?.():null;
  if(samples) for(const sample of samples) extendStroke(sample);
  extendStroke(event);
};
function finishStroke(event,cancel){
  if(!gesture || gesture.id!==event.pointerId) return;
  if(!cancel) extendStroke(event);
  const {node,mode}=gesture;
  const emptyOval=mode==='oval' && (!node.rx.baseVal.value || !node.ry.baseVal.value);
  if(cancel || emptyOval) node.remove();
  else undone.length=0;
  gesture=null;
  if(ink.hasPointerCapture(event.pointerId)) ink.releasePointerCapture(event.pointerId);
  updateDrawingActions();
}
ink.onpointerup=event=>finishStroke(event,false);
ink.onpointercancel=ink.onlostpointercapture=event=>finishStroke(event,true);
window.addEventListener('keydown',event=>{
  if(gesture || !(event.ctrlKey || event.metaKey) || event.altKey ||
    event.target.matches('input,textarea,select,[contenteditable=true]')) return;
  const redo=event.code==='KeyY' || (event.code==='KeyZ' && event.shiftKey);
  if(redo || event.code==='KeyZ'){
    event.preventDefault();$(redo?'redo':'undo').click();
  }
});
function exportContent(s){
  if(!strokes.childElementCount) return content(s);
  const background=s.clear?'':'<rect width="100%" height="100%" fill="#fff"/>';
  return ($('withGrid').checked?content(s):background)+
    '<g transform="scale('+s.size/1024+')">'+strokes.outerHTML+'</g>';
}
function download(blob,filename){
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url;a.download=filename;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function pngFrom(svg,size){
  const url=URL.createObjectURL(svg);
  try{
    const img=new Image();img.src=url;await img.decode();
    const canvas=document.createElement('canvas');canvas.width=canvas.height=size;canvas.getContext('2d').drawImage(img,0,0);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG')),'image/png'));
  }finally{URL.revokeObjectURL(url)}
}
$('save').onclick=async()=>{
  const s={...state}, format=$('format').value.toLowerCase();$('save').disabled=true;
  try{
    const n=s.size;
    const svg=new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="'+n+'" height="'+n+'" viewBox="0 0 '+n+' '+n+'">'+exportContent(s)+'</svg>'],{type:'image/svg+xml;charset=utf-8'});
    download(format==='svg'?svg:await pngFrom(svg,n),'lekalo-'+s.kind+'-'+n+'.'+format);
    $('notice').textContent=format.toUpperCase()+' готов к скачиванию';
  }catch{$('notice').textContent='Не удалось создать файл. Попробуйте ещё раз.'}
  finally{$('save').disabled=false}
};
new ResizeObserver(layout).observe($('stage'));render();layout();
</script>
</html>
