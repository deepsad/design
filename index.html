<main><div class="titlebar"><h1>Генератор сеток</h1><div class="actions"><label class="export-grid" id="exportOptions" hidden><input type="checkbox" id="withGrid" checked>Включить сетку</label><select class="format" id="format" aria-label="Формат экспорта"><option>SVG</option><option>PNG</option></select><button class="primary" id="save"><svg class="ico"><use href="#download"/></svg><span id="saveLabel">Скачать сетку</span></button></div></div>
<div class="layout"><section class="panel"><div class="bar"><h2><svg class="ico"><use href="#frame"/></svg>Рабочий лист</h2><div class="tool"><button id="out" aria-label="Уменьшить" title="Уменьшить"><svg class="ico"><use href="#minus"/></svg></button><output id="scale">100%</output><button id="into" aria-label="Увеличить" title="Увеличить"><svg class="ico"><use href="#plus"/></svg></button><button id="fitView" aria-label="Вписать лист" title="Вписать лист"><svg class="ico"><use href="#fit"/></svg></button></div></div>
<div class="drawbar" aria-label="Рисование"><div class="tools" role="group" aria-label="Инструмент">
<button data-tool="fill" aria-pressed="true"><svg class="ico" viewBox="0 0 24 24"><path d="m3 12 8-8 8 8-8 8-8-8zm4-10 6 6M4 12h14M21 15c-1 2-2 3-2 4a2 2 0 0 0 4 0c0-1-1-2-2-4z"/></svg>Заливка</button>
<button data-tool="pen" aria-pressed="false"><svg class="ico"><use href="#pencilIcon"/></svg>Перо</button>

<div class="pen-style"><input type="color" value="#23272a" id="inkColor" aria-label="Цвет штриха" title="Цвет штриха"><select id="inkWidth" aria-label="Толщина штриха" title="Толщина штриха"><option value="2">2 px</option><option value="4">4 px</option><option value="8" selected>8 px</option><option value="16">16 px</option><option value="32">32 px</option></select></div>

    regions=inside?polygonClipping.intersection(regions,[ring]):polygonClipping.difference(regions,[ring]);
  }
  if(kind==='module'||kind==='radial'){
    const limit=kind==='module'?half:half*Math.SQRT2;
    const maxRing=Math.floor((limit+1e-7)/step);
    const lower=Math.min(maxRing,Math.floor(Math.hypot(x,y)/step));
    if(lower) applyCircle(0,0,lower*step);
    if(lower<maxRing) applyCircle(0,0,(lower+1)*step);

      for(const [cx,cy] of [[0,-r],[r,0],[0,r],[-r,0]]) applyCircle(cx,cy,r);

  }

    const d=rings.map(ring=>ring.map(([px,py],i)=>(i?'L':'M')+round(px+512)+' '+round(py+512)).join('')+'Z').join('');

function faceAt(point){
  if(lastFace && containsContext.isPointInPath(lastFace.path,point.x,point.y,'evenodd')) return lastFace;

}
function previewFace(point){
  const face=faceAt(point);
  hover.setAttribute('d',face?.d||'');hover.setAttribute('fill',erase?'#777777':$('inkColor').value);hover.setAttribute('opacity','.24');
}
ink.onpointerleave=()=>{cancelAnimationFrame(hoverFrame);hover.removeAttribute('d')};
function paintFace(point){
  const face=faceAt(point);
  if(!face) return;
  const existing=Array.from(fills.children).find(node=>node.getAttribute('d')===face.d);
  const color=$('inkColor').value;
  if(erase && !existing || !erase && existing?.getAttribute('fill')===color) return;
  let change;
  if(erase){
    const next=existing.nextSibling;
    change={undo:()=>fills.insertBefore(existing,next),redo:()=>existing.remove()};
  }else if(existing){
    const original=existing.getAttribute('fill');
    change={undo:()=>existing.setAttribute('fill',original),redo:()=>existing.setAttribute('fill',color)};
  }else{
    const node=document.createElementNS(ink.namespaceURI,'path');
    node.setAttribute('d',face.d);node.setAttribute('fill',color);node.setAttribute('fill-rule','evenodd');
    change={undo:()=>node.remove(),redo:()=>fills.append(node)};
  }
  change.redo();remember(change);refreshPaint();
}
function extendStroke(event){
  const {node,start,mode}=gesture, point=localPoint(event);
  let dx=point.x-start.x, dy=point.y-start.y;
  if(mode==='pen'){
    const previous=node.points.getItem(node.points.numberOfItems-1);
    if(previous.x!==point.x || previous.y!==point.y) node.points.appendItem(point);
  }else if(mode==='line'){
    if(event.shiftKey){
      const length=Math.hypot(dx,dy);
      const angle=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*Math.PI/4;
      dx=length*Math.cos(angle); dy=length*Math.sin(angle);
    }
    node.setAttribute('x2',start.x+dx); node.setAttribute('y2',start.y+dy);
  }else{
    if(event.shiftKey){
      const side=Math.max(Math.abs(dx),Math.abs(dy));
      dx=(Math.sign(dx)||1)*side; dy=(Math.sign(dy)||1)*side;
    }
    node.setAttribute('cx',start.x+dx/2); node.setAttribute('cy',start.y+dy/2);
    node.setAttribute('rx',Math.abs(dx)/2); node.setAttribute('ry',Math.abs(dy)/2);
  }
}
ink.onpointerdown=event=>{
  if(event.button!==0 || !event.isPrimary || gesture) return;
  event.preventDefault();
  const start=localPoint(event);
  if(tool==='fill'){paintFace(start);return}
  const node=document.createElementNS(ink.namespaceURI,{pen:'polyline',line:'line',oval:'ellipse'}[tool]);
  node.setAttribute('stroke',$('inkColor').value);
  node.setAttribute('stroke-width',Number($('inkWidth').value)*1024/state.size);
  if(tool==='pen') node.setAttribute('points',start.x+','+start.y+' '+start.x+','+start.y);
  if(tool==='line'){node.setAttribute('x1',start.x);node.setAttribute('y1',start.y)}

ink.onpointermove=event=>{

    const point=localPoint(event);cancelAnimationFrame(hoverFrame);
    hoverFrame=requestAnimationFrame(()=>previewFace(point));return;
  }
  if(!gesture || gesture.id!==event.pointerId) return;
  const samples=gesture.mode==='pen'?event.getCoalescedEvents?.():null;

};
function finishStroke(event,cancel){
  if(!gesture || gesture.id!==event.pointerId) return;
  if(!cancel) extendStroke(event);
  const {node,mode}=gesture;
  const emptyOval=mode==='oval' && (!node.rx.baseVal.value || !node.ry.baseVal.value);
  if(cancel || emptyOval) node.remove();
  else remember({undo:()=>node.remove(),redo:()=>strokes.append(node)});
  gesture=null;
  if(ink.hasPointerCapture(event.pointerId)) ink.releasePointerCapture(event.pointerId);

}
ink.onpointerup=event=>finishStroke(event,false);
ink.onpointercancel=ink.onlostpointercapture=event=>finishStroke(event,true);
window.addEventListener('keydown',event=>{
  if(gesture || !(event.ctrlKey || event.metaKey) || event.altKey ||
    event.target.matches('input,textarea,select,[contenteditable=true]')) return;
  const redo=event.code==='KeyY' || (event.code==='KeyZ' && event.shiftKey);
  if(redo || event.code==='KeyZ'){
    event.preventDefault();$(redo?'redo':'undo').click();
  }
});
function exportContent(s){
  if(!strokes.childElementCount && !fills.childElementCount) return content(s);
  return content(s,scaledFills(s.size),$('withGrid').checked)+
    '<g transform="scale('+s.size/1024+')">'+strokes.outerHTML+'</g>';
}
function download(blob,filename){
  const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url;a.download=filename;
  document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
}
async function pngFrom(svg,size){
  const url=URL.createObjectURL(svg);
  try{
    const img=new Image();img.src=url;await img.decode();
    const canvas=document.createElement('canvas');canvas.width=canvas.height=size;canvas.getContext('2d').drawImage(img,0,0);
    return await new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('PNG')),'image/png'));
  }finally{URL.revokeObjectURL(url)}
}
$('save').onclick=async()=>{
  const s={...state}, format=$('format').value.toLowerCase();$('save').disabled=true;
  try{
    const n=s.size;
    const svg=new Blob(['<svg xmlns="http://www.w3.org/2000/svg" width="'+n+'" height="'+n+'" viewBox="0 0 '+n+' '+n+'">'+exportContent(s)+'</svg>'],{type:'image/svg+xml;charset=utf-8'});
    download(format==='svg'?svg:await pngFrom(svg,n),'lekalo-'+s.kind+'-'+n+'.'+format);
    $('notice').textContent=format.toUpperCase()+' готов к скачиванию';
  }catch{$('notice').textContent='Не удалось создать файл. Попробуйте ещё раз.'}
  finally{$('save').disabled=false}
};
new ResizeObserver(layout).observe($('stage'));render();layout();
</script>
